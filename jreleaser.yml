
release:
  github:
    owner: jdbc-observations
    username: ttddyy
    changelog:
      formatted: ALWAYS
      format: '- {{commitShortHash}} {{commitTitle}}'
      # RELEASE_NOTES: latest section of CHANGELOG, set by the release workflow
      content: |
        ## What's Changed

        {{{Env.RELEASE_NOTES}}}

        See [CHANGELOG](https://github.com/jdbc-observations/datasource-micrometer/blob/{{tagName}}/CHANGELOG) for all versions.

        ## Commits

        {{changelogChanges}}
        {{changelogContributors}}

signing:
  active: ALWAYS
  armored: true

deploy:
  maven:
    mavenCentral:
      release-deploy:
        active: RELEASE
        url: https://central.sonatype.com/api/v1/publisher
        stagingRepositories:
          - target/staging-deploy
    nexus2:
      snapshot-deploy:
        active: SNAPSHOT
        url: https://central.sonatype.com/repository/maven-snapshots
        snapshotUrl: https://central.sonatype.com/repository/maven-snapshots
        applyMavenCentralRules: true
        snapshotSupported: true
        closeRepository: true
        releaseRepository: true
        stagingRepositories:
          - target/staging-deploy
